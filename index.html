<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @font-face {
      font-family: 'Jersey20';
      src: url('assets/Jersey20.ttf') format('truetype');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 240px;
      height: 196px;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    #app {
      position: relative;
      width: 240px;
      height: 196px;
    }

    /* ── Reminder bubble ─────────────────────────────────────────── */
    #bubble-wrap {
      position: absolute;
      top: 0; left: 0;
      width: 240px;
      height: 100px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #bubble-wrap.visible {
      pointer-events: auto;
      opacity: 1;
    }

    #bubble-box {
      position: absolute;
      top: 0; left: 2px;
      width: 236px;
      height: 78px;
      background: #ffb3cc;
      /* pixel border: 4px solid green with inner highlight */
      border: 3px solid #1a6b1a;
      box-shadow:
        inset 2px 2px 0 #ff85aa,
        inset -2px -2px 0 #cc6688,
        3px 3px 0 #0d3d0d;
      image-rendering: pixelated;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 28px 0 8px;
    }

    #bubble-text {
      font-family: 'Jersey20', monospace;
      font-size: 15px;
      color: #0d4d0d;
      text-align: center;
      line-height: 1.3;
      text-shadow: 1px 1px 0 #ff85aa;
    }

    /* pixel-style close button */
    #bubble-close {
      position: absolute;
      top: 4px; right: 4px;
      width: 22px; height: 22px;
      background: #1a6b1a;
      border: 2px solid #0d3d0d;
      box-shadow: 2px 2px 0 #0d3d0d;
      color: #ffe80a;
      font-family: 'Jersey20', monospace;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      image-rendering: pixelated;
    }
    #bubble-close:hover {
      background: #cc0000;
      box-shadow: 1px 1px 0 #0d3d0d;
      transform: translate(1px, 1px);
    }
    #bubble-close:active {
      box-shadow: none;
      transform: translate(2px, 2px);
    }

    /* pixel tail triangle */
    #bubble-tail {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left:  10px solid transparent;
      border-right: 10px solid transparent;
      border-top:   14px solid #1a6b1a;
    }
    #bubble-tail::after {
      content: '';
      position: absolute;
      top: -17px; left: -8px;
      width: 0; height: 0;
      border-left:  8px solid transparent;
      border-right: 8px solid transparent;
      border-top:   12px solid #ffb3cc;
    }

    /* ── Frog canvas ──────────────────────────────────────────────── */
    #frog-canvas {
      position: absolute;
      top: 100px; left: 0;
      width: 240px;
      height: 96px;
      cursor: grab;
      image-rendering: pixelated;
    }
    #frog-canvas:active { cursor: grabbing; }

    /* ── Pixel right-click menu ───────────────────────────────────── */
    #ctx-menu {
      display: none;
      position: fixed;
      z-index: 9999;
      min-width: 200px;
      background: #3b200f;
      border: 3px solid #2d8a2d;
      box-shadow: 4px 4px 0 #0d3d0d,
                  inset 1px 1px 0 #4caf50;
      font-family: 'Jersey20', monospace;
      overflow: hidden;
    }
    #ctx-menu.open { display: block; }

    .ctx-item {
      padding: 8px 16px;
      font-size: 15px;
      color: #ffe80a;
      letter-spacing: 1px;
      cursor: pointer;
      text-shadow: 1px 1px 0 #1a0a00;
      white-space: nowrap;
    }
    .ctx-item:hover {
      background: #2d8a2d;
      box-shadow: inset 2px 0 0 #4caf50;
      color: #ffe80a;
    }
    .ctx-item:active {
      background: #1a5c1a;
      transform: translateX(2px);
    }
    .ctx-sep {
      height: 3px;
      background: #2d8a2d;
      box-shadow: 0 1px 0 #0d3d0d;
      margin: 2px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="bubble-wrap">
      <div id="bubble-box">
        <span id="bubble-text"></span>
        <button id="bubble-close">X</button>
      </div>
      <div id="bubble-tail"></div>
    </div>
    <canvas id="frog-canvas" width="240" height="96"></canvas>

    <!-- Pixel right-click menu -->
    <div id="ctx-menu">
      <div class="ctx-item" id="ctx-wave">🐸  Wave!</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" id="ctx-remind">💧  Remind me now</div>
      <div class="ctx-item" id="ctx-settings">⚙  Settings</div>
      <div class="ctx-sep"></div>
      <div class="ctx-item" id="ctx-quit">Quit</div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
