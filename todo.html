<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family:'Jersey20'; src:url('assets/Jersey20.ttf') format('truetype'); }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width:320px; height:460px;
    background:#3b200f;
    font-family: 'Times New Roman', serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }

  /* ── Pixel frame ──────────────────────────────────────────────── */
  #frame {
    display:flex; flex-direction:column;
    height:100%;
    border:4px solid #2d8a2d;
    box-shadow: inset 2px 2px 0 #4caf50, inset -2px -2px 0 #1a5c1a, 0 0 0 1px #0d3d0d;
  }

  #titlebar {
    background:#2d8a2d;
    border-bottom:3px solid #1a5c1a;
    box-shadow: inset 0 -2px 0 #0d3d0d;
    height:34px; flex-shrink:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 8px;
    -webkit-app-region:drag; cursor:move;
    font-family:'Jersey20',monospace;
  }
  #titlebar span { font-size:17px; color:#ffe80a; text-shadow:2px 2px 0 #1a5c1a; letter-spacing:1px; }

  .pixel-btn {
    -webkit-app-region:no-drag;
    background:#cc1a00; border:2px solid #7a0e00; box-shadow:2px 2px 0 #7a0e00;
    color:#ffe80a; font-family:'Jersey20',monospace; font-size:13px;
    width:22px; height:22px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .pixel-btn:hover  { background:#ff2200; transform:translate(0,1px); box-shadow:1px 1px 0 #7a0e00; }
  .pixel-btn:active { transform:translate(2px,2px); box-shadow:none; }

  /* ── Add item bar ─────────────────────────────────────────────── */
  #add-bar {
    display:flex; gap:6px; align-items:center;
    padding:8px 10px 6px;
    flex-shrink:0;
    border-bottom:2px solid #2d8a2d;
  }
  #new-input {
    flex:1;
    background:#2a1308; color:#ffe80a;
    border:2px solid #2d8a2d; box-shadow:inset 1px 1px 0 #0d3d0d;
    padding:5px 8px;
    font-family:'Times New Roman', serif; font-size:14px;
    outline:none;
  }
  #new-input::placeholder { color:#7a5530; }
  #new-input:focus { border-color:#4caf50; }
  #add-btn {
    background:#2d8a2d; border:2px solid #1a5c1a; box-shadow:2px 2px 0 #0d3d0d;
    color:#ffe80a; font-family:'Jersey20',monospace; font-size:13px;
    padding:5px 10px; cursor:pointer; letter-spacing:1px; flex-shrink:0;
  }
  #add-btn:hover  { background:#3ca83c; transform:translate(0,1px); }
  #add-btn:active { transform:translate(2px,2px); box-shadow:none; }

  /* ── Todo list ────────────────────────────────────────────────── */
  #list {
    flex:1; overflow-y:auto;
    padding:4px 0;
    /* ruled paper lines */
    background: repeating-linear-gradient(
      to bottom,
      #3b200f 0px, #3b200f 27px,
      #4a2810 28px, #4a2810 29px
    );
  }
  #list::-webkit-scrollbar { width:6px; }
  #list::-webkit-scrollbar-track { background:#2a1308; }
  #list::-webkit-scrollbar-thumb { background:#2d8a2d; border:1px solid #0d3d0d; }

  .todo-item {
    display:flex; align-items:center; gap:8px;
    padding:4px 10px; min-height:29px;
    cursor:default;
    border-left:3px solid transparent;
  }
  .todo-item.drag-over { border-left:3px solid #ffe80a; background:rgba(255,232,10,0.06); }

  .drag-handle {
    color:#4a6a40; font-size:14px; cursor:grab; flex-shrink:0;
    -webkit-user-select:none; user-select:none;
  }
  .drag-handle:active { cursor:grabbing; }

  /* pixel checkbox */
  .todo-cb {
    width:16px; height:16px; flex-shrink:0;
    appearance:none; -webkit-appearance:none;
    background:#2a1308; border:2px solid #2d8a2d;
    cursor:pointer; position:relative;
  }
  .todo-cb:checked { background:#2d8a2d; }
  .todo-cb:checked::after {
    content:'✓'; position:absolute; top:-3px; left:1px;
    color:#ffe80a; font-size:13px; font-family:'Jersey20',monospace;
  }

  .todo-text {
    flex:1; background:transparent; border:none; outline:none;
    color:#ffe80a; font-family:'Times New Roman', serif; font-size:14px;
    -webkit-user-select:text; user-select:text;
    caret-color:#ffe80a;
  }
  .todo-text.done { text-decoration:line-through; color:#7a5530; }

  .del-btn {
    background:transparent; border:none; color:#7a0e00;
    font-size:16px; cursor:pointer; flex-shrink:0; opacity:0;
    transition:opacity 0.15s; line-height:1;
  }
  .todo-item:hover .del-btn { opacity:1; }
  .del-btn:hover { color:#ff2200; }

  /* ── Footer ───────────────────────────────────────────────────── */
  #footer {
    border-top:2px solid #2d8a2d; padding:6px 10px;
    display:flex; justify-content:space-between; align-items:center;
    flex-shrink:0;
  }
  #count { font-family:'Jersey20',monospace; font-size:12px; color:#4caf50; letter-spacing:1px; }
  #clear-done {
    background:#2d8a2d; border:2px solid #1a5c1a; box-shadow:2px 2px 0 #0d3d0d;
    color:#ffe80a; font-family:'Jersey20',monospace; font-size:11px;
    padding:3px 8px; cursor:pointer; letter-spacing:1px;
  }
  #clear-done:hover { background:#3ca83c; }
</style>
</head>
<body>
<div id="frame">
  <div id="titlebar">
    <span>☑ TODO LIST</span>
    <button class="pixel-btn" id="close-btn">X</button>
  </div>

  <div id="add-bar">
    <input id="new-input" type="text" placeholder="Add a new task...">
    <button id="add-btn">ADD</button>
  </div>

  <div id="list"></div>

  <div id="footer">
    <span id="count"></span>
    <button id="clear-done">CLEAR DONE</button>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron')

let items = []   // [{id, text, done}]
let dragSrc = null

// ── Persist ───────────────────────────────────────────────────────
async function load() {
  items = await ipcRenderer.invoke('load-todo') || []
  render()
}
function save() { ipcRenderer.send('save-todo', items) }

// ── Render ────────────────────────────────────────────────────────
function render() {
  const list = document.getElementById('list')
  list.innerHTML = ''
  items.forEach((item, idx) => {
    const row = document.createElement('div')
    row.className = 'todo-item'
    row.draggable = true
    row.dataset.idx = idx

    row.innerHTML = `
      <span class="drag-handle">≡</span>
      <input type="checkbox" class="todo-cb" ${item.done ? 'checked' : ''}>
      <input type="text" class="todo-text ${item.done ? 'done' : ''}" value="${escHtml(item.text)}">
      <button class="del-btn" title="Delete">✕</button>
    `

    const cb   = row.querySelector('.todo-cb')
    const txt  = row.querySelector('.todo-text')
    const del  = row.querySelector('.del-btn')

    cb.addEventListener('change', () => {
      items[idx].done = cb.checked
      txt.classList.toggle('done', cb.checked)
      save(); updateCount()
    })

    txt.addEventListener('input',  () => { items[idx].text = txt.value; save() })
    txt.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addItem(''); focusLast() }
    })

    del.addEventListener('click', () => { items.splice(idx, 1); save(); render() })

    // ── Drag to reorder ──────────────────────────────────────────
    row.addEventListener('dragstart', e => {
      dragSrc = idx
      e.dataTransfer.effectAllowed = 'move'
      row.style.opacity = '0.5'
    })
    row.addEventListener('dragend',   () => { row.style.opacity = '1'; clearDragOver() })
    row.addEventListener('dragover',  e => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move'
      clearDragOver(); row.classList.add('drag-over')
    })
    row.addEventListener('drop', e => {
      e.preventDefault()
      if (dragSrc === null || dragSrc === idx) return
      const moved = items.splice(dragSrc, 1)[0]
      items.splice(idx, 0, moved)
      save(); render()
    })

    list.appendChild(row)
  })
  updateCount()
}

function clearDragOver() {
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'))
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function updateCount() {
  const done  = items.filter(i => i.done).length
  document.getElementById('count').textContent = `${done}/${items.length} DONE`
}

function addItem(text) {
  items.push({ id: Date.now(), text, done: false })
  save(); render()
}

function focusLast() {
  const inputs = document.querySelectorAll('.todo-text')
  if (inputs.length) inputs[inputs.length - 1].focus()
}

// ── Events ────────────────────────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', () => {
  const inp = document.getElementById('new-input')
  const val = inp.value.trim()
  if (val) { addItem(val); inp.value = ''; inp.focus() }
})

document.getElementById('new-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = e.target.value.trim()
    if (val) { addItem(val); e.target.value = '' }
  }
})

document.getElementById('clear-done').addEventListener('click', () => {
  items = items.filter(i => !i.done); save(); render()
})

document.getElementById('close-btn').addEventListener('click', () => window.close())

load()
</script>
</body>
</html>
